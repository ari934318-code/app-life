name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npx cap add android && npx cap sync android
      - name: Set version
        run: |
          V=$(cat VERSION)
          echo "V=$V" >> $GITHUB_ENV
          CODE=$(git rev-list --count HEAD)
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk planner-v$V.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          files: planner-v*.apk