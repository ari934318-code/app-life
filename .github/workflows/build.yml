name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - run: npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7

      - run: npx cap add android && npx cap sync android

      - name: Add native notification code
        run: |
          set -e
          JAVA_DIR="android/app/src/main/java/com/ari/planner"
          mkdir -p "$JAVA_DIR"
          SRC="."
          if [ -f native/CountdownPlugin.java ]; then SRC="native"; fi
          cp "$SRC/CountdownPlugin.java" "$JAVA_DIR/CountdownPlugin.java"
          cp "$SRC/MainActivity.java" "$JAVA_DIR/MainActivity.java"
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission\|<application" android/app/src/main/AndroidManifest.xml
          ls "$JAVA_DIR"

      - name: Set Android app icon
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick

          RES="android/app/src/main/res"

          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"
            size="${item##*:}"

            mkdir -p "$RES/mipmap-$density"

            convert "icon-512.png" \
              -resize "${size}x${size}!" \
              "$RES/mipmap-$density/ic_launcher.png"

            convert "icon-maskable-512.png" \
              -resize "${size}x${size}!" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          rm -rf "$RES/mipmap-anydpi-v26"

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Set version
        run: |
          V=$(cat VERSION)
          echo "V=$V" >> $GITHUB_ENV
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA * 10000 + MI * 100 + PA))
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - run: cd android && ./gradlew assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk flowerlife-v$V.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          files: flowerlife-v*.apk