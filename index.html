<style>
/* Layout concept: one centered column of frosted-glass panels floating over a black field lit by a crimson glow (top) and a deep leaf-green glow (bottom); silver hairlines, thin numerals, crimson only for state. */
:root{
  --bg:#070709; --ink:#efeeea; --ink2:#c4c3bd; --muted:#8c8b86; --faint:#5f5e5a;
  --g1:rgba(255,255,255,.075); --g2:rgba(255,255,255,.035); --gl:rgba(255,255,255,.12);
  --red:#c9283c; --red-hi:#f0606d; --silver:#d9d7d1;

  --fd:"Aref Ruqaa","Vazirmatn",serif; --fb:"Vazirmatn",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.65 var(--fb);min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px)}
.o1{width:92vmax;height:92vmax;right:-50vmax;top:-54vmax;background:radial-gradient(circle,rgba(196,30,50,.6),rgba(120,12,28,.26) 46%,transparent 68%);animation:drift 40s ease-in-out infinite alternate}
.o2{width:84vmax;height:84vmax;left:-48vmax;bottom:-44vmax;background:radial-gradient(circle,rgba(36,78,64,.55),transparent 66%)}
.o3{width:50vmax;height:50vmax;left:6vmax;top:24vh;background:radial-gradient(circle,rgba(255,255,255,.055),transparent 66%)}
@keyframes drift{to{transform:translate(-7vmax,6vmax)}}
@media(prefers-reduced-motion:reduce){.o1{animation:none}*{transition:none!important}}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 132px;display:flex;flex-direction:column;gap:14px}
.glass{position:relative;background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gl);border-radius:26px;padding:18px;
  -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 26px 50px -30px rgba(0,0,0,.95)}

.eyebrow{font-size:12.5px;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:14px;padding:6px 2px 2px}
.navrow{display:flex;align-items:center;gap:8px}
.pill{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px;border-radius:999px;border:1px solid var(--gl);background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.pill b{font-weight:400;font-size:14px;text-align:center;flex:1;min-width:0}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--gl);background:rgba(255,255,255,.06);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.ibtn:hover{background:rgba(255,255,255,.13)}
.btn{font:400 14px var(--fb);border-radius:999px;padding:9px 18px;border:1px solid var(--gl);background:rgba(255,255,255,.07);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.13)}

.link{background:none;border:0;color:var(--ink2);text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:4px;cursor:pointer;font:300 13px var(--fb);padding:6px 0}

.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 8px;border-radius:19px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer;position:relative;min-width:0}

@media(min-width:520px){.wd .s{display:none}.wd .f{display:inline}}

.pt{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:15px;border:1px solid var(--gl);background:rgba(255,255,255,.04);color:var(--ink);font:300 14px var(--fb);cursor:pointer;text-align:start}

.on>.sw,.sw.on{background:var(--red)} .on>.sw::after,.sw.on::after{right:19px}

.task{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.task:last-child{border-bottom:0}

.rt{font-size:12px;color:var(--ink2);padding:1px 9px;border:1px solid var(--gl);border-radius:999px;flex:none}
.ib{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:9px;display:grid;place-items:center}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:12px}
.stats b{display:block;font:200 32px/1.1 var(--fb)} .stats span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

.cb{aspect-ratio:1/1.1;border-radius:13px;border:1px solid rgba(255,255,255,.07);background:rgba(217,215,209,var(--a,.02));color:var(--ink);font:300 12px var(--fb);position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;min-width:0}

.cb.today{border-color:var(--red-hi)} .cb.sel{outline:1px solid rgba(255,255,255,.55)} .cb.empty{visibility:hidden}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{border:1px solid var(--gl);background:rgba(255,255,255,.04);border-radius:20px;padding:10px 4px 12px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;min-width:0}
.pc.on{border-color:rgba(240,96,109,.6);background:rgba(201,40,60,.13)}
.pc svg{width:62px;height:84px} .pc b{font-weight:400;font-size:13px} .pc span{font-size:11.5px;color:var(--muted)}

.timer{font:200 56px/1 var(--fb)}
.live .bar{width:100%;max-width:300px}
.garden{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gc{text-align:center;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}

.gc b{font:200 22px/1 var(--fb)} .gc span{font-size:11.5px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0} .hist li{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13.5px}

.days{display:flex;gap:4px;flex-wrap:wrap}

.days button.on{background:rgba(255,255,255,.14);color:var(--ink);border-color:rgba(255,255,255,.3)}
.tog{background:none;border:0;padding:0;cursor:pointer}
.note{font-size:13px;color:var(--muted);line-height:1.8}
.hint{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.foot{text-align:center;font:700 17px/1.8 var(--fd);color:var(--ink2);padding:14px 0 0}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:20;pointer-events:none;

.gc{position:relative;overflow:hidden}

 case'rChip':{const s=SUGG[+v];putMeta('settings',m=>{(m.remind=m.remind||[]).push({id:'r'+uid(),label:s[0],time:s[1],days:[1,1,1,1,1,1,1],on:1});return m});break}
 case'rDel':putMeta('settings',m=>{m.remind=(m.remind||[]).filter(r=>r.id!==v);return m});break;
 case'rTgl':putMeta('settings',m=>{const r=(m.remind||[]).find(r=>r.id===v);if(r)r.on=r.on?0:1;return m});break;
 case'rDay':{const[id,i]=v.split(':');putMeta('settings',m=>{const r=(m.remind||[]).find(r=>r.id===id);if(r){r.days=r.days||[0,0,0,0,0,0,0];r.days[+i]=r.days[+i]?0:1}return m});break}
 case'pick':S.pick=v;render();break;
 case'atab':S.atab=v;render();break;
 case'bqAdd':{const o=ownN(v);S.ask=null;if((S.bq[v]|0)<o&&sumC(S.bq)<BQ_MAX)S.bq[v]=(S.bq[v]|0)+1;render();break}
 case'bqSub':S.ask=null;if(S.bq[v]>0)S.bq[v]--;render();break;
 case'bkAdd':{const o=FS()[v]|0;S.ask=null;if((S.bk[v]|0)<o&&sumC(S.bk)<BK_MAX)S.bk[v]=(S.bk[v]|0)+1;render();break}
 case'bkSub':S.ask=null;if(S.bk[v]>0)S.bk[v]--;render();break;
 case'mkBq':case'mkBk':{if(S.demo){toast('در حالت نمونه نمی‌شود','اول از حالت نمونه خارج شو');break}if(sumC(a==='mkBq'?S.bq:S.bk)){S.ask=a==='mkBq'?'b':'k';render()}break}
 case'mkNo':S.ask=null;render();break;
 case'mkOk':{const isB=S.ask==='b',sel=isB?S.bq:S.bk;S.ask=null;if(!sumC(sel)){render();break}const f={};Object.keys(sel).forEach(k=>{if(sel[k]>0)f[k]=sel[k]});
  const name=(S.gname||'').trim(),url=giftURL(isB?'b':'k',name,f);
  if(isB)Object.keys(f).forEach(t=>{[...S.rd.fl.values()].filter(x=>x.type===t&&x.status==='grown'&&!x.g).sort((p,q)=>p.end-q.end).slice(0,f[t]).forEach(x=>putFlower({...x,g:1}))});
  else putMeta('fruit',m=>{Object.keys(f).forEach(k=>{m[k]=Math.max(0,(m[k]|0)-f[k])});return m},true);
  putMeta('gifts',m=>{m.list=[{k:isB?'b':'k',n:sumC(f),d:todayIso(),u:url}].concat(m.list||[]).slice(0,12);return m},true);
  if(isB)S.bq={};else S.bk={};copyText(url).then(ok=>toast(ok?'لینک هدیه کپی شد':'لینک ساخته شد',(isB?fa(sumC(f))+' گل از باغت کم شد':fa(sumC(f))+' میوه از انبارت کم شد')));render();break}
 case'cp':{const g=((S.rd.meta.get('gifts')||{}).list||[])[+v];if(g)copyText(g.u).then(ok=>toast(ok?'لینک کپی شد':'کپی نشد','می‌توانی از دکمه‌ی ارسال استفاده کنی'));break}
 case'sh':{const g=((S.rd.meta.get('gifts')||{}).list||[])[+v];if(!g)break;const txt=giftText(g.k,'')+'\n'+g.u;if(navigator.share)navigator.share({text:txt}).catch(()=>{});else copyText(g.u).then(()=>toast('لینک کپی شد','در پیام‌رسان بچسبان'));break}
 case'start':{if(S.demo){S.demo=false;toast('از حالت نمونه خارج شدی','گل واقعی در باغ خودت کاشته می‌شود')}const n=Date.now(),f=FLW[S.pick];S.giveConfirm=false;putMeta('away',()=>({id:'f-'+n,type:S.pick,start:n,end:n+f.mins*6e4}));break}
 case'giveAsk':S.giveConfirm=true;render();break;
 case'giveNo':S.giveConfirm=false;render();break;
 case'giveup':{const a=S.rd.meta.get('away');S.giveConfirm=false;if(a&&a.end)finishAway(a,'wilted');render();break}
 case'demo':S.dd=makeDemo();S.demo=true;render();break;
 case'demoOff':S.demo=false;render();break;
 case'export':{try{const bl=new Blob([JSON.stringify({v:1,days:[...S.rd.days],fl:[...S.rd.fl],meta:[...S.rd.meta]})],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='planner-backup-'+todayIso()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('فایل پشتیبان ساخته شد','در پوشه‌ی دانلودها')}catch(e){toast('گرفتن پشتیبان ممکن نشد')}break}
 case'natOn':natPerms(true).then(()=>{render()});break;
 case'natExact':try{NAT.LN.changeExactNotificationSetting().then(()=>natPerms(false)).then(()=>render())}catch(e){}break;
 case'natTest':try{NAT.LN.schedule({notifications:[{id:9002,title:'اعلان آزمایشی',body:'اگر این را می‌بینی اعلان‌ها درست کار می‌کنند',channelId:'reminders',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});toast('اعلان آزمایشی','تا چند ثانیه‌ی دیگر می‌آید. می‌توانی اپ را ببندی.')}catch(e){}break;
 case'notif':try{Notification.requestPermission().then(p=>{toast(p==='granted'?'اعلان مرورگر فعال شد':'اعلان مرورگر اجازه نگرفت');render()})}catch(e){toast('اعلان مرورگر در این نمایش پشتیبانی نمی‌شود')}break;
 }}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-a]');if(el)act(el.dataset.a,el.dataset.v,el)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const m={newTask:'add',newHabit:'habAdd',rLabel:'rAdd'}[e.target.id];if(m){e.preventDefault();act(m)}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
 if(k==='note')putDay(S.sel,d=>{d.note=t.value},false,true);
 if(k==='gname'){S.gname=t.value.slice(0,24);putMeta('settings',m=>{m.gname=S.gname;return m},true)}
 if(k==='gbase')putMeta('settings',m=>{m.giftBase=t.value.trim().slice(0,200);return m},true);
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='imp'&&t.files&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!Array.isArray(o.days))throw 0;S.rd.days=new Map(o.days);S.rd.fl=new Map(o.fl||[]);S.rd.meta=new Map(o.meta||[]);saveLocal();toast('پشتیبان بازیابی شد');render()}catch(err){toast('این فایل پشتیبان معتبر نیست')}};rd.readAsText(t.files[0]);return}if(t.dataset&&t.dataset.in==='time'){const id=t.dataset.v,v=t.value;putDay(S.sel,d=>{const x=d.tasks.find(y=>y.id===id);if(x){if(v)x.r=v;else delete x.r}},true)}});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.pending&&!isEditing())renderSoft()},80)});
/* tooltip */
const tipEl=$('#tip');let tipT;
function showTip(el,x,y){const s=el.getAttribute('data-tip');if(!s){tipEl.hidden=true;return}tipEl.textContent=s;tipEl.hidden=false;const r=tipEl.getBoundingClientRect();
 const px=clamp(x-r.width/2,8,innerWidth-r.width-8);let py=y-r.height-14;if(py<8)py=y+20;tipEl.style.transform=`translate(${px}px,${py}px)`}
const hideTip=()=>{tipEl.hidden=true};
document.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t,e.clientX,e.clientY)});
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||tipEl.hidden)return;const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t,e.clientX,e.clientY);else hideTip()});
document.addEventListener('pointerout',e=>{if(e.pointerType!=='touch')hideTip()});
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&!t.matches('button')){showTip(t,e.clientX,e.clientY);clearTimeout(tipT);tipT=setTimeout(hideTip,2600)}else hideTip()});
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('[data-tip]')){const r=t.getBoundingClientRect();showTip(t,r.left+r.width/2,r.top)}});
document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('[data-tip]'))hideTip()});
/* ---------- storage sync ---------- */
function subscribe(){
 const b=S.base,maps={days:()=>S.rd.days,flowers:()=>S.rd.fl,meta:()=>S.rd.meta};
 const mk=(col,q,apply)=>q.onSnapshot(snap=>{
  const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));
  const loc=maps[col]();
  if(m.size===0&&loc.size>0&&!S['mig'+col]){S['mig'+col]=true;loc.forEach((o,id)=>dbWrite(col,id,o,0));return}
  S.dirty.forEach(key=>{const i=key.indexOf('/');if(key.slice(0,i)===col){const l=loc.get(key.slice(i+1));if(l)m.set(key.slice(i+1),l)}});
  const sig=JSON.stringify([...m]);if(S.sig[col]===sig)return;S.sig[col]=sig;apply(m);saveLocal();renderSoft()},
  ()=>{S.base=null;renderSoft()});
 mk('days',b.collection('days').orderBy('k','desc').limit(900),m=>{S.rd.days=m});
 mk('flowers',b.collection('flowers').orderBy('start','desc').limit(900),m=>{S.rd.fl=m});
 mk('meta',b.collection('meta'),m=>{S.rd.meta=m;if(S.demo&&S.dd)S.dd.meta=m});}
function checkUpdate(){try{if(!window.Capacitor||typeof fetch!=='function')return;const c=new AbortController(),tm=setTimeout(()=>c.abort(),7000);
 fetch(UPD_API,{signal:c.signal,headers:{Accept:'application/vnd.github+json'}}).then(r=>r.json()).then(o=>{clearTimeout(tm);const n=x=>String(x||'').replace(/^v/,'').split('.').map(y=>+y||0),a=n(o.tag_name),b=n(APP_VER);
  for(let i=0;i<3;i++){if((a[i]|0)>(b[i]|0)){S.upd=String(o.tag_name).replace(/^v/,'');renderSoft();return}if((a[i]|0)<(b[i]|0))return}}).catch(()=>{})}catch(e){}}
async function init(){
 loadLocal();render();setInterval(tick,1000);checkUpdate();natPerms(false).then(()=>{if(S.tab==='remind')renderSoft()});
 try{if(window.claude&&claude.use){const r=await Promise.all([claude.use('db'),claude.use('user')]),db=r[0],user=r[1],id=user?await user.id():null;
  if(db&&id){S.base=db.doc('data/users/'+id+'/app');subscribe()}}}catch(e){}
 renderSoft()}
{const G=readGift();if(G)showGift(G);else init()}
